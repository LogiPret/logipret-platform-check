name: Validate and deploy platform check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-check-main
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m unittest -v
      - name: Build the exact Dockerfile for security inspection
        run: docker build --tag platform-check:ci .
      - name: Check for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: platform-check:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
  deploy:
    needs: validate
    if: vars.COOLIFY_URL != '' && vars.COOLIFY_APP_UUID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deploy the tested main branch
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          test -n "$COOLIFY_DEPLOY_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            --get --data-urlencode "uuid=$COOLIFY_APP_UUID" \
            "$COOLIFY_URL/api/v1/deploy"
